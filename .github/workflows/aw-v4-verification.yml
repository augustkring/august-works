name: AW V4 Verification

on:
  push:
    branches:
      - feat/august-works-unified-platform-v4
      - feat/aw-v4-completion
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: aw-v4-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  static-and-build:
    name: Typecheck, migration guards, build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Verify Node policy
        run: pnpm check:node-version

      - name: Verify migration numbering and safety
        run: pnpm --filter @paperclipai/db check:migrations

      - name: Verify UI design tokens
        run: pnpm check:tokens && pnpm check:token-gates

      - name: Verify OpenClaw workflow smoke syntax
        run: bash -n scripts/smoke/openclaw-gateway-e2e.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  managed-native-test-prerequisites:
    name: Build managed Native test prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Build managed Native provider pack
        run: |
          set -euo pipefail
          provider_pack="$RUNNER_TEMP/paperclip-native-provider-pack"
          artifact_dir="$RUNNER_TEMP/aw-v4-managed-native-prerequisites"
          mkdir -p "$artifact_dir"
          pnpm --filter @paperclipai/paperclip-runner run build:binary
          pnpm --filter @paperclipai/paperclip-runner run build:provider-pack "$provider_pack"
          git diff --exit-code -- pnpm-lock.yaml
          test -x "$provider_pack/dist/bin/paperclip-runnerd"
          git rev-parse HEAD > "$artifact_dir/source-commit.txt"
          tar -czf "$artifact_dir/provider-pack.tar.gz" -C "$provider_pack" .
          (cd "$artifact_dir" && sha256sum provider-pack.tar.gz source-commit.txt > provider-pack.sha256)

      - name: Fetch pinned managed Native OpenShell prover
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/aw-v4-managed-native-prerequisites/openshell-prover-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 \
            https://github.com/NVIDIA/OpenShell/releases/download/v0.1.2/openshell-prover-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          echo "e1c9db66ae459850cab43765d7ad569effe2ac0a338c902a1b895d0cc361fbb0  $archive" | sha256sum --check
          test "$(tar -tzf "$archive")" = openshell-prover
          binary_sha=$(tar -xOzf "$archive" openshell-prover | sha256sum | cut -d ' ' -f 1)
          test "$binary_sha" = 3e80c0d041a7552d57cc338868bc825a6261e21b5f29a7d7527bcc7926d423f1

      - name: Retain managed Native test prerequisites
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aw-v4-managed-native-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aw-v4-managed-native-prerequisites/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  tests:
    name: Repository tests (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [managed-native-test-prerequisites]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: server-1
            args: --mode general --group general-server --shard-index 0 --shard-count 4
          - partition: server-2
            args: --mode general --group general-server --shard-index 1 --shard-count 4
          - partition: server-3
            args: --mode general --group general-server --shard-index 2 --shard-count 4
          - partition: server-4
            args: --mode general --group general-server --shard-index 3 --shard-count 4
          - partition: workspaces-a-1
            args: --mode general --group general-workspaces-a --shard-index 0 --shard-count 2
          - partition: workspaces-a-2
            args: --mode general --group general-workspaces-a --shard-index 1 --shard-count 2
          - partition: workspaces-b
            args: --mode general --group general-workspaces-b
          - partition: routes-1
            args: --mode serialized --shard-index 0 --shard-count 4
          - partition: routes-2
            args: --mode serialized --shard-index 1 --shard-count 4
          - partition: routes-3
            args: --mode serialized --shard-index 2 --shard-count 4
          - partition: routes-4
            args: --mode serialized --shard-index 3 --shard-count 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install root-owned Node for remote erasure mechanics tests
        if: startsWith(matrix.partition, 'server-')
        env:
          ERASER_TEST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          trusted_node_dir=/usr/local/libexec/paperclip-erasure-test-node
          observer_dir=/usr/local/libexec/paperclip-fixture-observers
          # Check every existing target/ancestor BEFORE any privileged install.
          # Missing descendants may be installed; existing different bytes are never replaced.
          observer_check_chain() {
            local current="$1" observer_mode
            while [[ ! -e "$current" && ! -L "$current" ]]; do current=${current%/*}; done
            while :; do
              test "$(/usr/bin/readlink -f -- "$current")" = "$current"
              test "$(/usr/bin/stat -Lc %u -- "$current")" = 0
              observer_mode=$(/usr/bin/stat -Lc %a -- "$current")
              (( (8#$observer_mode & 8#6022) == 0 ))
              test "$current" = / && break
              current=${current%/*}
              test -n "$current" || current=/
            done
          }
          for observer_target in "$trusted_node_dir/node" "$observer_dir/native-session-handles-v1" "$observer_dir/native-session-handles-v1.mjs" "$observer_dir/native-model-socket-v1" "$observer_dir/native-model-socket-v1.mjs"; do
            if [[ -e "$observer_target" || -L "$observer_target" ]]; then test -f "$observer_target"; fi
            observer_check_chain "$observer_target"
          done
          test ! -e "$trusted_node_dir/node" || /usr/bin/cmp -s "$(command -v node)" "$trusted_node_dir/node"
          echo "9045f8998cfe2fd12b706b58b459d1271815c37175a8017d1d958a3afbc009e8  scripts/fixtures/native-session-handle-observer" | /usr/bin/sha256sum --check --strict
          echo "7a092f75132698d5e43c0424fc103b100f0dd62353e80ca5c5d3d71969462f55  scripts/fixtures/native-session-handle-observer.mjs" | /usr/bin/sha256sum --check --strict
          for observer_name in native-session-handles-v1 native-session-handles-v1.mjs; do
            observer_expected=9045f8998cfe2fd12b706b58b459d1271815c37175a8017d1d958a3afbc009e8
            [[ "$observer_name" != *.mjs ]] || observer_expected=7a092f75132698d5e43c0424fc103b100f0dd62353e80ca5c5d3d71969462f55
            if [[ -e "$observer_dir/$observer_name" ]]; then
              echo "$observer_expected  $observer_dir/$observer_name" | /usr/bin/sha256sum --check --strict
            fi
          done
          # Separate fixed read-only live socket observer; no Stop/erasure authority.
          echo "ef02d5bc28b9886840627269d2bd5aa29bdc7b0582b939556c469db785461079  scripts/fixtures/native-model-socket-observer" | /usr/bin/sha256sum --check --strict
          echo "a2f1183beaa1594c452bb17956e29f53030dc3de36ef59f830e82b3e186c08f4  scripts/fixtures/native-model-socket-observer.mjs" | /usr/bin/sha256sum --check --strict
          # Unprivileged injected-I/O regression before any privileged observer install.
          observer_test_node="$(command -v node)"
          /usr/bin/timeout --kill-after=1s 5s /usr/bin/env -i PATH=/usr/bin:/bin "$observer_test_node" --no-addons --disable-proto=throw --test scripts/fixtures/native-model-socket-observer.test.mjs
          for observer_name in native-model-socket-v1 native-model-socket-v1.mjs; do
            observer_expected=ef02d5bc28b9886840627269d2bd5aa29bdc7b0582b939556c469db785461079
            [[ "$observer_name" != *.mjs ]] || observer_expected=a2f1183beaa1594c452bb17956e29f53030dc3de36ef59f830e82b3e186c08f4
            if [[ -e "$observer_dir/$observer_name" ]]; then
              echo "$observer_expected  $observer_dir/$observer_name" | /usr/bin/sha256sum --check --strict
            fi
          done
          for observer_directory in "$trusted_node_dir" "$observer_dir"; do
            if [[ ! -e "$observer_directory" ]]; then sudo install -d -o root -g root -m 0755 "$observer_directory"; fi
          done
          if [[ ! -e "$trusted_node_dir/node" ]]; then
            sudo install -o root -g root -m 0755 "$(command -v node)" "$trusted_node_dir/node"
          fi
          if [[ ! -e "$observer_dir/native-session-handles-v1" ]]; then
            sudo install -o root -g root -m 0555 scripts/fixtures/native-session-handle-observer "$observer_dir/native-session-handles-v1"
          fi
          if [[ ! -e "$observer_dir/native-session-handles-v1.mjs" ]]; then
            sudo install -o root -g root -m 0444 scripts/fixtures/native-session-handle-observer.mjs "$observer_dir/native-session-handles-v1.mjs"
          fi
          if [[ ! -e "$observer_dir/native-model-socket-v1" ]]; then
            sudo install -o root -g root -m 0555 scripts/fixtures/native-model-socket-observer "$observer_dir/native-model-socket-v1"
          fi
          if [[ ! -e "$observer_dir/native-model-socket-v1.mjs" ]]; then
            sudo install -o root -g root -m 0444 scripts/fixtures/native-model-socket-observer.mjs "$observer_dir/native-model-socket-v1.mjs"
          fi
          /usr/bin/cmp -s "$(command -v node)" "$trusted_node_dir/node"
          echo "9045f8998cfe2fd12b706b58b459d1271815c37175a8017d1d958a3afbc009e8  $observer_dir/native-session-handles-v1" | /usr/bin/sha256sum --check --strict
          echo "7a092f75132698d5e43c0424fc103b100f0dd62353e80ca5c5d3d71969462f55  $observer_dir/native-session-handles-v1.mjs" | /usr/bin/sha256sum --check --strict
          echo "ef02d5bc28b9886840627269d2bd5aa29bdc7b0582b939556c469db785461079  $observer_dir/native-model-socket-v1" | /usr/bin/sha256sum --check --strict
          echo "a2f1183beaa1594c452bb17956e29f53030dc3de36ef59f830e82b3e186c08f4  $observer_dir/native-model-socket-v1.mjs" | /usr/bin/sha256sum --check --strict
          for observer_target in "$trusted_node_dir/node" "$observer_dir/native-session-handles-v1" "$observer_dir/native-session-handles-v1.mjs" "$observer_dir/native-model-socket-v1" "$observer_dir/native-model-socket-v1.mjs"; do
            observer_check_chain "$observer_target"
          done
          # Run ONLY the finite unprivileged kernel control; the observer itself cannot signal/write.
          echo "a6fba302c87c6eaefe0c0a10b625cb3f14ae2959956900eeeb314c7912dfdfab  scripts/fixtures/native-session-handle-observer-check.mjs" | /usr/bin/sha256sum --check --strict
          /usr/bin/timeout --kill-after=2s 12s /usr/bin/env -i PATH=/usr/bin:/bin "$trusted_node_dir/node" --no-addons --disable-proto=throw scripts/fixtures/native-session-handle-observer-check.mjs
          echo "PAPERCLIP_TEST_ERASER_NODE_PATH=$trusted_node_dir/node" >> "$GITHUB_ENV"
          echo "PAPERCLIP_TEST_PRIVILEGED_SESSION_OBSERVER=1" >> "$GITHUB_ENV"
          # Qualify actual same-UID nondumpable completeness and socket ownership before enabling this distinct lane.
          echo "1f7081f83a2dfe63b4c76e80e9e83e8852d6b3ec94856542554cf4f8f2541a6a  scripts/fixtures/native-model-socket-observer-check.mjs" | /usr/bin/sha256sum --check --strict
          /usr/bin/timeout --kill-after=2s 12s /usr/bin/env -i PATH=/usr/bin:/bin "$trusted_node_dir/node" --no-addons --disable-proto=throw scripts/fixtures/native-model-socket-observer-check.mjs
          echo "PAPERCLIP_TEST_PRIVILEGED_MODEL_SOCKET_OBSERVER=1" >> "$GITHUB_ENV"
          # The disposable GitHub image exposes this root-owned PATH directory
          # as 0777. Lock that known image directory before workspace installs;
          # self-hosted images retain their operator-managed permissions.
          if [[ "$ERASER_TEST_RUNNER_ENVIRONMENT" == github-hosted ]]; then
            eraser_image_bin=/usr/local/bin
            test "$(/usr/bin/readlink -f -- "$eraser_image_bin")" = "$eraser_image_bin"
            test "$(/usr/bin/stat -Lc %u -- "$eraser_image_bin")" = 0
            eraser_image_bin_mode=$(/usr/bin/stat -Lc %a -- "$eraser_image_bin")
            echo "eraser-profile original-path=$eraser_image_bin uid=0 mode=$eraser_image_bin_mode"
            if [[ "$eraser_image_bin_mode" == 777 ]]; then
              sudo chmod 0755 -- "$eraser_image_bin"
            fi
          fi
          # Report the exact fixed binary profile when a hosted runner refuses it.
          # These are public path/owner/mode facets; no environment values or file bodies.
          for executable in "$trusted_node_dir/node" /bin/sh /usr/bin/env /usr/bin/readlink /usr/bin/stat /usr/bin/sha256sum /usr/bin/cut /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
            current_binary=$(/usr/bin/readlink -f -- "$executable")
            while :; do
              /usr/bin/stat -Lc 'eraser-profile path=%n uid=%u mode=%a' -- "$current_binary"
              test "$current_binary" = / && break
              current_binary=${current_binary%/*}
              test -n "$current_binary" || current_binary=/
            done
          done


      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare workspace build dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Download managed Native test prerequisites
        if: startsWith(matrix.partition, 'server-')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aw-v4-managed-native-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aw-v4-managed-native-prerequisites

      - name: Prepare managed Native fixture inputs
        if: startsWith(matrix.partition, 'server-')
        shell: bash
        run: bash scripts/ci-prepare-managed-native-fixture-inputs.sh

      - name: Install generated-code sandbox
        if: startsWith(matrix.partition, 'server-')
        run: bash scripts/ci-install-native-sandbox.sh

      - name: Run stable test suite
        run: pnpm test:run ${{ matrix.args }}

  security-regression-plan:
    name: Plan changed-source security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selectors_json: ${{ steps.plan.outputs.selectors_json }}
      selected_files_json: ${{ steps.plan.outputs.selected_files_json }}
      has_selectors: ${{ steps.plan.outputs.has_selectors }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare workspace build dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Validate V10 security regression selectors
        run: |
          node scripts/check-v10-security-fast-path.mjs
          node --test scripts/check-v10-security-fast-path.test.mjs

      - name: Resolve selectors and config-aware shard count
        id: plan
        shell: bash
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${CHANGE_BASE}" ] || [[ "${CHANGE_BASE}" =~ ^0+$ ]]; then
            selectors="$(node scripts/check-v10-security-fast-path.mjs --all)"
          else
            selectors="$(node scripts/check-v10-security-fast-path.mjs --base "${CHANGE_BASE}")"
          fi
          if [ -z "$selectors" ]; then
            printf 'matrix={"include":[{"shard":1,"count":1}]}\nselectors_json=[]\nselected_files_json=[]\nhas_selectors=false\nshard_count=0\n' >> "$GITHUB_OUTPUT"
            echo "No protected V10 source path changed."
            exit 0
          fi
          selector_file="$RUNNER_TEMP/v10-security-selectors.txt"
          file_list="$RUNNER_TEMP/v10-security-files.txt"
          printf '%s\n' "$selectors" > "$selector_file"
          mapfile -t selected_tests < "$selector_file"
          pnpm run preflight:workspace-links
          pnpm exec vitest list --filesOnly --json="$file_list" "${selected_tests[@]}"
          node --input-type=module - "$selector_file" "$file_list" "$GITHUB_OUTPUT" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { relative } from "node:path";
          const [selectorFile, fileList, outputFile] = process.argv.slice(2);
          const selectors = readFileSync(selectorFile, "utf8").split(/\r?\n/).filter(Boolean);
          const listed = JSON.parse(readFileSync(fileList, "utf8"));
          if (!Array.isArray(listed) || listed.some(entry => !entry || typeof entry.file !== "string" || !entry.file)) {
            throw new Error("Invalid config-aware Vitest file list");
          }
          const files = [...new Set(listed.map(entry => relative(process.cwd(), entry.file)))];
          if (selectors.length === 0 || files.length === 0) throw new Error("Changed security selectors resolved to zero Vitest files");
          const shardCount = Math.min(4, files.length);
          const matrix = { include: Array.from({ length: shardCount }, (_, index) => ({ shard: index + 1, count: shardCount })) };
          appendFileSync(outputFile, `matrix=${JSON.stringify(matrix)}\nselectors_json=${JSON.stringify(selectors)}\nselected_files_json=${JSON.stringify(files)}\nhas_selectors=true\nshard_count=${shardCount}\n`);
          console.log(`Resolved ${selectors.length} original selectors to ${files.length} Vitest files across ${shardCount} serial shards.`);
          NODE

  security-regressions:
    name: Changed-source security regressions (${{ matrix.shard }}/${{ matrix.count }})
    needs: [security-regression-plan, managed-native-test-prerequisites]
    if: needs.security-regression-plan.outputs.has_selectors == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.security-regression-plan.outputs.matrix) }}
    env:
      SECURITY_SELECTORS_JSON: ${{ needs.security-regression-plan.outputs.selectors_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install root-owned Node for runtime asset erasure tests
        if: contains(fromJSON(needs.security-regression-plan.outputs.selected_files_json), 'server/src/services/native-runtime/runtime-asset-retention.test.ts')
        shell: bash
        env:
          ERASER_TEST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          # The erasure profile validates every fixed PATH directory. Normalize
          # the writable directory supplied by the GitHub-hosted image.
          if [[ "$ERASER_TEST_RUNNER_ENVIRONMENT" == github-hosted ]]; then
            eraser_image_bin=/usr/local/bin
            test "$(/usr/bin/readlink -f -- "$eraser_image_bin")" = "$eraser_image_bin"
            test "$(/usr/bin/stat -Lc %u -- "$eraser_image_bin")" = 0
            eraser_image_bin_mode=$(/usr/bin/stat -Lc %a -- "$eraser_image_bin")
            if [[ "$eraser_image_bin_mode" == 777 ]]; then
              sudo chmod 0755 -- "$eraser_image_bin"
            fi
            eraser_image_bin_mode=$(/usr/bin/stat -Lc %a -- "$eraser_image_bin")
            (( (8#$eraser_image_bin_mode & 8#6022) == 0 ))
          fi
          node_source="$(command -v node)"
          node_real="$(/usr/bin/readlink -f -- "$node_source")"
          case "$node_real" in
            "$RUNNER_TOOL_CACHE"/node/*/bin/node) ;;
            *) echo "setup-node executable is outside RUNNER_TOOL_CACHE" >&2; exit 1 ;;
          esac
          expected_version="v$(/usr/bin/tr -d '\r\n' < .nvmrc)"
          source_version="$("$node_real" --version)"
          test "$source_version" = "$expected_version"
          source_sha="$(/usr/bin/sha256sum -- "$node_real" | /usr/bin/cut -d ' ' -f 1)"
          trusted_dir=/usr/local/libexec/paperclip-erasure-test-node
          trusted_node="$trusted_dir/node"
          check_root_chain() {
            local current="$1" mode
            while [[ ! -e "$current" && ! -L "$current" ]]; do current=${current%/*}; done
            while :; do
              test "$(/usr/bin/readlink -f -- "$current")" = "$current"
              test "$(/usr/bin/stat -Lc %u -- "$current")" = 0
              mode="$(/usr/bin/stat -Lc %a -- "$current")"
              (( (8#$mode & 8#6022) == 0 ))
              test "$current" = / && break
              current=${current%/*}; test -n "$current" || current=/
            done
          }
          check_root_chain "$trusted_node"
          if [[ -e "$trusted_node" || -L "$trusted_node" ]]; then
            test -f "$trusted_node"
            test "$(/usr/bin/stat -Lc %u -- "$trusted_node")" = 0
            /usr/bin/cmp -s -- "$node_real" "$trusted_node"
          else
            if [[ ! -d "$trusted_dir" ]]; then sudo install -d -o root -g root -m 0755 "$trusted_dir"; fi
            check_root_chain "$trusted_node"
            sudo install -o root -g root -m 0755 -- "$node_real" "$trusted_node"
          fi
          test "$(/usr/bin/stat -Lc %u -- "$trusted_node")" = 0
          test "$(/usr/bin/stat -Lc %a -- "$trusted_node")" = 755
          test "$("$trusted_node" --version)" = "$source_version"
          test "$(/usr/bin/sha256sum -- "$trusted_node" | /usr/bin/cut -d ' ' -f 1)" = "$source_sha"
          check_root_chain "$trusted_node"
          echo "PAPERCLIP_TEST_ERASER_NODE_PATH=$trusted_node" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare workspace build dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Download managed Native test prerequisites
        if: contains(needs.security-regression-plan.outputs.selected_files_json, 'server/')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aw-v4-managed-native-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aw-v4-managed-native-prerequisites

      - name: Prepare managed Native fixture inputs
        if: contains(needs.security-regression-plan.outputs.selected_files_json, 'server/')
        shell: bash
        run: bash scripts/ci-prepare-managed-native-fixture-inputs.sh

      - name: Install generated-code sandbox
        if: contains(needs.security-regression-plan.outputs.selected_files_json, 'server/')
        run: bash scripts/ci-install-native-sandbox.sh

      - name: Run one serial Vitest shard with default and JSON reporters
        id: run-shard
        shell: bash
        run: |
          set -euo pipefail
          selector_file="$RUNNER_TEMP/v10-security-selectors.txt"
          node --input-type=module - "$selector_file" <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(process.argv[2], `${JSON.parse(process.env.SECURITY_SELECTORS_JSON).join("\n")}\n`);
          NODE
          mapfile -t selected_tests < "$selector_file"
          pnpm run preflight:workspace-links
          execution_report="$(mktemp --suffix=.json "$RUNNER_TEMP/v10-security-vitest-${{ matrix.shard }}-XXXXXX")"
          text_log="${execution_report%.json}.log"
          echo "report=$execution_report" >> "$GITHUB_OUTPUT"
          echo "text_log=$text_log" >> "$GITHUB_OUTPUT"
          set +e
          pnpm exec vitest run "${selected_tests[@]}" --maxWorkers=1 --no-file-parallelism \
            --shard=${{ matrix.shard }}/${{ matrix.count }} --reporter=default --reporter=json --outputFile "$execution_report" 2>&1 | tee "$text_log"
          test_status=${PIPESTATUS[0]}
          set -e
          exit "$test_status"

      - name: Guard this shard's JSON execution receipt
        if: always()
        env:
          EXECUTION_REPORT: ${{ steps.run-shard.outputs.report }}
        run: node scripts/check-v10-security-regression-execution.mjs --shard "$EXECUTION_REPORT"

      - name: Upload shard diagnostics and JSON receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aw-v4-security-regression-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ steps.run-shard.outputs.report }}
            ${{ steps.run-shard.outputs.text_log }}
          if-no-files-found: warn
          retention-days: 3

  security-regression-aggregate:
    name: Verify complete changed-source security coverage
    needs: [security-regression-plan, security-regressions]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download every shard report
        if: needs.security-regression-plan.outputs.has_selectors == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: aw-v4-security-regression-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/v10-security-shards
          merge-multiple: true

      - name: Verify original selectors across all shard reports
        if: always()
        env:
          PLAN_RESULT: ${{ needs.security-regression-plan.result }}
          SHARDS_RESULT: ${{ needs.security-regressions.result }}
          HAS_SELECTORS: ${{ needs.security-regression-plan.outputs.has_selectors }}
          SELECTORS_JSON: ${{ needs.security-regression-plan.outputs.selectors_json }}
          SHARD_COUNT: ${{ needs.security-regression-plan.outputs.shard_count }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != success ]]; then echo "Security regression planning failed." >&2; exit 1; fi
          if [[ "$HAS_SELECTORS" != true ]]; then echo "No changed-source selectors; full hard gates remain required."; exit 0; fi
          selector_file="$RUNNER_TEMP/v10-security-selectors.txt"
          node --input-type=module - "$selector_file" <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(process.argv[2], `${JSON.parse(process.env.SELECTORS_JSON).join("\n")}\n`);
          NODE
          mapfile -t selected_tests < "$selector_file"
          node scripts/check-v10-security-regression-execution.mjs --aggregate \
            "$RUNNER_TEMP/v10-security-shards" "$SHARD_COUNT" "${selected_tests[@]}"
          if [[ "$SHARDS_RESULT" != success ]]; then echo "One or more changed-source security shards failed." >&2; exit 1; fi

  security-evals:
    name: Security hard gates
    needs: security-regression-aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare workspace build dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Prepare generated-code sandbox
        shell: bash
        run: |
          if [ ! -x /usr/bin/bwrap ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          test -x /usr/bin/bwrap
          test -x /usr/bin/prlimit

          # GitHub's Ubuntu 24.04 image can expose bwrap while AppArmor still
          # blocks unprivileged user namespaces. This runner is ephemeral; make
          # the namespace capability explicit here, then prove the exact
          # isolation primitives required by the generated-code hard gate.
          userns_clone="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$userns_clone" ] && [ "$userns_clone" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          apparmor_userns="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$apparmor_userns" ] && [ "$apparmor_userns" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          /usr/bin/bwrap \
            --unshare-user \
            --die-with-parent \
            --new-session \
            --unshare-pid \
            --unshare-ipc \
            --unshare-uts \
            --unshare-net \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            -- \
            /usr/bin/prlimit \
            --nproc=512 \
            --cpu=4 \
            --as=2199023255552 \
            --nofile=64 \
            -- \
            /usr/bin/true

      - name: Reject high and critical production dependency advisories
        run: pnpm audit --prod --audit-level high

      - name: Verify security-eval coverage
        run: pnpm check:aw-v4-security-evals

      - name: Run deterministic security hard gates
        run: pnpm test:aw-v4-security-evals

  product-browser:
    name: Product browser (${{ matrix.journey }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - journey: V4 product journeys
            config: tests/e2e/playwright.config.ts
            spec: tests/e2e/aw-v4-completion.spec.ts
          - journey: V5 planning and governed behavior
            config: tests/e2e/playwright.config.ts
            spec: tests/e2e/aw-v5-runtime-fabric.spec.ts
          - journey: V5 authenticated company boundaries
            config: tests/e2e/aw-v5-authenticated.config.ts
            spec: tests/e2e/aw-v5-authenticated.spec.ts
          - journey: V7 authenticated discovery and governance
            config: tests/e2e/aw-v7-authenticated.config.ts
            spec: tests/e2e/aw-v7-authenticated.spec.ts
          - journey: V10 authenticated native auth
            config: tests/e2e/aw-v10-native-auth.config.ts
            spec: tests/e2e/aw-v10-native-auth.spec.ts
          - journey: V10 authenticated support Help
            config: tests/e2e/aw-v10-support.config.ts
            spec: tests/e2e/aw-v10-support.spec.ts
          - journey: V10 authenticated agent chat
            config: tests/e2e/aw-v10-agent-chat.config.ts
            spec: 'tests/e2e/agent-chat-(sessions|projects)\.spec\.ts'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare workspace build dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Native chat Runner
        if: matrix.config == 'tests/e2e/aw-v10-agent-chat.config.ts'
        working-directory: packages/paperclip-runner/runner
        run: cargo build --locked --release --bin paperclip-runnerd

      - name: Verify product browser journey
        run: pnpm exec playwright test --config '${{ matrix.config }}' '${{ matrix.spec }}'

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-browser-failure-${{ strategy.job-index }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
            test-results/v5-authenticated
            test-results/v7-authenticated
            test-results/v10-agent-chat-authenticated
          if-no-files-found: ignore

  pilot-readiness:
    name: Pilot readiness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - static-and-build
      - tests
      - security-evals
      - product-browser
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Verify customer-pilot readiness contract
        run: pnpm check:aw-v4-pilot-readiness

      - name: Test customer-pilot readiness gate
        run: pnpm test:aw-v4-pilot-readiness
