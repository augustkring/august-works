    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install root-owned Node for remote erasure mechanics tests
        if: matrix.group == 'general-server-without-chat' || matrix.group == 'general-server-managed-native'
        env:
          ERASER_TEST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: &managed_native_image_node |
          trusted_node_dir=/usr/local/libexec/paperclip-erasure-test-node
          observer_dir=/usr/local/libexec/paperclip-fixture-observers
          # Check every existing target/ancestor BEFORE any privileged install.
          # Missing descendants may be installed; existing different bytes are never replaced.
          observer_check_chain() {
            local current="$1" observer_mode
            while [[ ! -e "$current" && ! -L "$current" ]]; do current=${current%/*}; done
            while :; do
              test "$(/usr/bin/readlink -f -- "$current")" = "$current"
              test "$(/usr/bin/stat -Lc %u -- "$current")" = 0
              observer_mode=$(/usr/bin/stat -Lc %a -- "$current")
              (( (8#$observer_mode & 8#6022) == 0 ))
              test "$current" = / && break
              current=${current%/*}
              test -n "$current" || current=/
            done
          }
          for observer_target in "$trusted_node_dir/node" "$observer_dir/native-session-handles-v1" "$observer_dir/native-session-handles-v1.mjs" "$observer_dir/native-model-socket-v1" "$observer_dir/native-model-socket-v1.mjs"; do
            if [[ -e "$observer_target" || -L "$observer_target" ]]; then test -f "$observer_target"; fi
            observer_check_chain "$observer_target"
          done
          test ! -e "$trusted_node_dir/node" || /usr/bin/cmp -s "$(command -v node)" "$trusted_node_dir/node"
          echo "9045f8998cfe2fd12b706b58b459d1271815c37175a8017d1d958a3afbc009e8  scripts/fixtures/native-session-handle-observer" | /usr/bin/sha256sum --check --strict
          echo "7a092f75132698d5e43c0424fc103b100f0dd62353e80ca5c5d3d71969462f55  scripts/fixtures/native-session-handle-observer.mjs" | /usr/bin/sha256sum --check --strict
          for observer_name in native-session-handles-v1 native-session-handles-v1.mjs; do
            observer_expected=9045f8998cfe2fd12b706b58b459d1271815c37175a8017d1d958a3afbc009e8
            [[ "$observer_name" != *.mjs ]] || observer_expected=7a092f75132698d5e43c0424fc103b100f0dd62353e80ca5c5d3d71969462f55
            if [[ -e "$observer_dir/$observer_name" ]]; then
              echo "$observer_expected  $observer_dir/$observer_name" | /usr/bin/sha256sum --check --strict
            fi
          done
          # Separate fixed read-only live socket observer; no Stop/erasure authority.
          echo "ef02d5bc28b9886840627269d2bd5aa29bdc7b0582b939556c469db785461079  scripts/fixtures/native-model-socket-observer" | /usr/bin/sha256sum --check --strict
          echo "a2f1183beaa1594c452bb17956e29f53030dc3de36ef59f830e82b3e186c08f4  scripts/fixtures/native-model-socket-observer.mjs" | /usr/bin/sha256sum --check --strict
          # Unprivileged injected-I/O regression before any privileged observer install.
          observer_test_node="$(command -v node)"
          /usr/bin/timeout --kill-after=1s 5s /usr/bin/env -i PATH=/usr/bin:/bin "$observer_test_node" --no-addons --disable-proto=throw --test scripts/fixtures/native-model-socket-observer.test.mjs
          for observer_name in native-model-socket-v1 native-model-socket-v1.mjs; do
            observer_expected=ef02d5bc28b9886840627269d2bd5aa29bdc7b0582b939556c469db785461079
            [[ "$observer_name" != *.mjs ]] || observer_expected=a2f1183beaa1594c452bb17956e29f53030dc3de36ef59f830e82b3e186c08f4
            if [[ -e "$observer_dir/$observer_name" ]]; then
              echo "$observer_expected  $observer_dir/$observer_name" | /usr/bin/sha256sum --check --strict
            fi
          done
          for observer_directory in "$trusted_node_dir" "$observer_dir"; do
            if [[ ! -e "$observer_directory" ]]; then sudo install -d -o root -g root -m 0755 "$observer_directory"; fi
          done
          if [[ ! -e "$trusted_node_dir/node" ]]; then
            sudo install -o root -g root -m 0755 "$(command -v node)" "$trusted_node_dir/node"
          fi
          if [[ ! -e "$observer_dir/native-session-handles-v1" ]]; then
            sudo install -o root -g root -m 0555 scripts/fixtures/native-session-handle-observer "$observer_dir/native-session-handles-v1"
          fi
          if [[ ! -e "$observer_dir/native-session-handles-v1.mjs" ]]; then
            sudo install -o root -g root -m 0444 scripts/fixtures/native-session-handle-observer.mjs "$observer_dir/native-session-handles-v1.mjs"
          fi
          if [[ ! -e "$observer_dir/native-model-socket-v1" ]]; then
            sudo install -o root -g root -m 0555 scripts/fixtures/native-model-socket-observer "$observer_dir/native-model-socket-v1"
          fi
          if [[ ! -e "$observer_dir/native-model-socket-v1.mjs" ]]; then
            sudo install -o root -g root -m 0444 scripts/fixtures/native-model-socket-observer.mjs "$observer_dir/native-model-socket-v1.mjs"
          fi
          /usr/bin/cmp -s "$(command -v node)" "$trusted_node_dir/node"
          echo "9045f8998cfe2fd12b706b58b459d1271815c37175a8017d1d958a3afbc009e8  $observer_dir/native-session-handles-v1" | /usr/bin/sha256sum --check --strict
          echo "7a092f75132698d5e43c0424fc103b100f0dd62353e80ca5c5d3d71969462f55  $observer_dir/native-session-handles-v1.mjs" | /usr/bin/sha256sum --check --strict
          echo "ef02d5bc28b9886840627269d2bd5aa29bdc7b0582b939556c469db785461079  $observer_dir/native-model-socket-v1" | /usr/bin/sha256sum --check --strict
          echo "a2f1183beaa1594c452bb17956e29f53030dc3de36ef59f830e82b3e186c08f4  $observer_dir/native-model-socket-v1.mjs" | /usr/bin/sha256sum --check --strict
          for observer_target in "$trusted_node_dir/node" "$observer_dir/native-session-handles-v1" "$observer_dir/native-session-handles-v1.mjs" "$observer_dir/native-model-socket-v1" "$observer_dir/native-model-socket-v1.mjs"; do
            observer_check_chain "$observer_target"
          done
          # Run ONLY the finite unprivileged kernel control; the observer itself cannot signal/write.
          echo "a6fba302c87c6eaefe0c0a10b625cb3f14ae2959956900eeeb314c7912dfdfab  scripts/fixtures/native-session-handle-observer-check.mjs" | /usr/bin/sha256sum --check --strict
          /usr/bin/timeout --kill-after=2s 12s /usr/bin/env -i PATH=/usr/bin:/bin "$trusted_node_dir/node" --no-addons --disable-proto=throw scripts/fixtures/native-session-handle-observer-check.mjs
          echo "PAPERCLIP_TEST_ERASER_NODE_PATH=$trusted_node_dir/node" >> "$GITHUB_ENV"
          echo "PAPERCLIP_TEST_PRIVILEGED_SESSION_OBSERVER=1" >> "$GITHUB_ENV"
          # Qualify actual same-UID nondumpable completeness and socket ownership before enabling this distinct lane.
          echo "1f7081f83a2dfe63b4c76e80e9e83e8852d6b3ec94856542554cf4f8f2541a6a  scripts/fixtures/native-model-socket-observer-check.mjs" | /usr/bin/sha256sum --check --strict
          /usr/bin/timeout --kill-after=2s 12s /usr/bin/env -i PATH=/usr/bin:/bin "$trusted_node_dir/node" --no-addons --disable-proto=throw scripts/fixtures/native-model-socket-observer-check.mjs
          echo "PAPERCLIP_TEST_PRIVILEGED_MODEL_SOCKET_OBSERVER=1" >> "$GITHUB_ENV"
          # The disposable GitHub image exposes this root-owned PATH directory
          # as 0777. Lock that known image directory before workspace installs;
          # self-hosted images retain their operator-managed permissions.
          if [[ "$ERASER_TEST_RUNNER_ENVIRONMENT" == github-hosted ]]; then
            eraser_image_bin=/usr/local/bin
            test "$(/usr/bin/readlink -f -- "$eraser_image_bin")" = "$eraser_image_bin"
            test "$(/usr/bin/stat -Lc %u -- "$eraser_image_bin")" = 0
            eraser_image_bin_mode=$(/usr/bin/stat -Lc %a -- "$eraser_image_bin")
            echo "eraser-profile original-path=$eraser_image_bin uid=0 mode=$eraser_image_bin_mode"
            if [[ "$eraser_image_bin_mode" == 777 ]]; then
              sudo chmod 0755 -- "$eraser_image_bin"
            fi
          fi
          # Report the exact fixed binary profile when a hosted runner refuses it.
          # These are public path/owner/mode facets; no environment values or file bodies.
          for executable in "$trusted_node_dir/node" /bin/sh /usr/bin/env /usr/bin/readlink /usr/bin/stat /usr/bin/sha256sum /usr/bin/cut /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
            current_binary=$(/usr/bin/readlink -f -- "$executable")
            while :; do
              /usr/bin/stat -Lc 'eraser-profile path=%n uid=%u mode=%a' -- "$current_binary"
              test "$current_binary" = / && break
              current_binary=${current_binary%/*}
              test -n "$current_binary" || current_binary=/
            done
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4

      # Share the checked-in lockfile key with master. PR merge refs must not
      # save full copies of the store or evict the post-merge build caches.
      - name: Locate pnpm store
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Download managed Native provider pack
        if: matrix.group == 'general-server-without-chat' || matrix.group == 'general-server-managed-native'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: managed-native-provider-pack-${{ github.run_id }}
          path: ${{ runner.temp }}/paperclip-native-provider-pack-artifact

      - name: Prepare managed Native fixture image bytes
        if: matrix.group == 'general-server-without-chat' || matrix.group == 'general-server-managed-native'
        run: &managed_native_image_bytes |
          artifact_dir="$RUNNER_TEMP/paperclip-native-provider-pack-artifact"
          provider_pack="$RUNNER_TEMP/paperclip-native-provider-pack"
          (cd "$artifact_dir" && sha256sum --check provider-pack.sha256)
          test "$(cat "$artifact_dir/source-commit.txt")" = "$(git rev-parse HEAD)"
          mkdir -p "$provider_pack"
          tar -xzf "$artifact_dir/provider-pack.tar.gz" -C "$provider_pack"
          test -f "$provider_pack/provider-pack.json"
          test -x "$provider_pack/dist/bin/paperclip-runnerd"
          echo "PAPERCLIP_RUNNER_REMOTE_PROVIDER_PACK_PATH=$provider_pack" >> "$GITHUB_ENV"
          echo "PAPERCLIP_RUNNER_BINARY=$provider_pack/dist/bin/paperclip-runnerd" >> "$GITHUB_ENV"
          archive="$artifact_dir/openshell-prover-x86_64-unknown-linux-musl.tar.gz"
          echo "e1c9db66ae459850cab43765d7ad569effe2ac0a338c902a1b895d0cc361fbb0  $archive" | sha256sum --check
          test "$(tar -tzf "$archive")" = openshell-prover
          prover_dir="$RUNNER_TEMP/managed-native-openshell-prover-v0.1.2"
          mkdir -m 700 "$prover_dir"
          tar -xzf "$archive" -C "$prover_dir" -- openshell-prover
          prover="$prover_dir/openshell-prover"
          echo "3e80c0d041a7552d57cc338868bc825a6261e21b5f29a7d7527bcc7926d423f1  $prover" | sha256sum --check
          test -x "$prover"
          echo "AW_V7_OPENSHELL_PROVER=$prover" >> "$GITHUB_ENV"
          node --input-type=module - "$provider_pack" "$GITHUB_ENV" <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { accessSync, appendFileSync, constants, lstatSync, readFileSync, realpathSync } from "node:fs";
          import { resolve, sep } from "node:path";
          const [pack, environment] = process.argv.slice(2);
          const root = realpathSync(pack);
          const manifest = JSON.parse(readFileSync(resolve(root, "provider-pack.json"), "utf8"));
          const expected = "sha256:513f500a1a5ea1dc7d865547ac87b32a8936334e8d5abd5b3ff585c45a170080";
          assert.equal(process.platform, "linux"); assert.equal(process.arch, "x64");
          assert.equal(manifest.schema, "paperclip-runner/remote-provider-pack/v1");
          assert.deepEqual(manifest.payload.target, { platform: "linux", architecture: "x64" });
          assert.equal(manifest.payload.pins.opencode, "1.18.32");
          const artifact = manifest.payload.artifacts.opencodeExecutable;
          assert.equal(artifact.path, "node_modules/opencode-ai/bin/opencode.exe");
          assert.equal(artifact.sha256, expected);
          const binary = realpathSync(resolve(root, artifact.path));
          assert.ok(binary.startsWith(root + sep), "OpenCode must remain inside the verified pack");
          const metadata = lstatSync(binary);
          assert.ok(metadata.isFile() && !metadata.isSymbolicLink());
          assert.equal(metadata.uid, process.getuid()); assert.equal(metadata.mode & 0o022, 0);
          accessSync(binary, constants.X_OK);
          assert.equal("sha256:" + createHash("sha256").update(readFileSync(binary)).digest("hex"), expected);
          appendFileSync(environment, `PAPERCLIP_QUALIFIED_OPENCODE_BINARY=${binary}\n`);
          NODE

      - name: Select installed Chrome for managed browser fixtures
        if: matrix.group == 'general-server-without-chat' || matrix.group == 'general-server-managed-native'
        run: |
          # Reuse the exact current partition, so only the browser's shard
          # needs Chrome even if recorded suite durations change its index.
          selection="$RUNNER_TEMP/managed-native-selected-suites.json"
          node scripts/run-vitest-stable.mjs --mode general --group '${{ matrix.group }}' \
            --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }} --dry-run > "$selection"
          browser_selected=$(node --input-type=module - "$selection" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const selected = JSON.parse(readFileSync(process.argv[2], "utf8")).selectedGeneralServerSuites;
          assert.ok(Array.isArray(selected) && selected.every(value => typeof value === "string"));
          process.stdout.write(String(selected.some(value => value.startsWith("server/src/services/native-runtime/native-opencode-managed-browser") && value.endsWith(".integration.test.ts"))));
          NODE
          )
          if [[ "$browser_selected" == true ]]; then
            # Existing hosted image prerequisite, also used by the e2e job.
            google-chrome --version
            chrome="$(dirname "$(readlink -f "$(command -v google-chrome)")")/chrome"
            test -x "$chrome"
            "$chrome" --version
            echo "PAPERCLIP_PLAYWRIGHT_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          fi

      - name: Install generated-code sandbox
        if: matrix.group == 'general-server-without-chat' || matrix.group == 'general-server-managed-native'
        run: bash scripts/ci-install-native-sandbox.sh

      - name: Run grouped general test suites
        env:
          PAPERCLIP_VITEST_REPORT_DIR: ${{ runner.temp }}/vitest-results
        run: |
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

      - name: Upload compact Vitest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/vitest-results/**/*.json
          if-no-files-found: warn
          retention-days: 3

  docker_context_integrity:
    name: Docker context integrity
    needs: gate
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Not every runner the gate can select ships the Buildx plugin —
      # the image-build workflows set it up explicitly, so this lane does
      # too rather than failing before it checks anything.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Same .dockerignore semantics as the real image builds: a
      # context-slimming change that strips a committed build input must
      # fail here, on the pull request, instead of failing every
      # post-merge image build. (2026-09-04: a new **/*.md ignore rule
      # stripped the committed capability contract out of the context;
      # every Docker build on master failed its drift check and no cloud
      # image published for eight hours while PR CI stayed green.)
      - name: Run generated-file drift checks against the Docker build context
        run: docker buildx build --file .github/docker-context-checks.Dockerfile .

  verify:
    # Preserve the legacy required-check name while the underlying work runs in parallel.
    name: verify
    if: ${{ always() }}
    needs: [gate, policy, help_docs, typecheck_release_registry, general_tests, verify_paperclip_runner, build, docker_context_integrity]
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 5

    steps:
      - name: Fail if any split verify lane failed
        env:
          FULL_CI: ${{ needs.gate.outputs.full_ci }}
          POLICY_RESULT: ${{ needs.policy.result }}
          HELP_DOCS_RESULT: ${{ needs.help_docs.result }}
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          RUNNER_VERIFICATION_RESULT: ${{ needs.verify_paperclip_runner.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_CONTEXT_INTEGRITY_RESULT: ${{ needs.docker_context_integrity.result }}
        run: |
          test "$POLICY_RESULT" = "success"
          test "$HELP_DOCS_RESULT" = "success"
          case "$FULL_CI" in
            true)
              test "$TYPECHECK_RELEASE_REGISTRY_RESULT" = "success"
              test "$GENERAL_TESTS_RESULT" = "success"
              test "$RUNNER_VERIFICATION_RESULT" = "success"
              test "$BUILD_RESULT" = "success"
              test "$DOCKER_CONTEXT_INTEGRITY_RESULT" = "success"
              ;;
            false)
              test "$TYPECHECK_RELEASE_REGISTRY_RESULT" = "skipped"
              test "$GENERAL_TESTS_RESULT" = "skipped"
              test "$RUNNER_VERIFICATION_RESULT" = "skipped"
              test "$BUILD_RESULT" = "skipped"
              test "$DOCKER_CONTEXT_INTEGRITY_RESULT" = "skipped"
              ;;
            *)
              echo "Invalid full_ci decision: $FULL_CI" >&2
              exit 1
              ;;
          esac

  verify_paperclip_runner:
    name: Verify Paperclip Runner (${{ matrix.lane_label }})
    needs: [gate]
    if: ${{ needs.gate.outputs.full_ci == 'true' }}
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # check:all spent ~380s of its ~600s cache-warm step inside the
          # runner package's vitest suite (run 35036001734, 2026-09-15); the
          # Rust tests took ~160s and every remaining check ~60s combined,
          # which made this single job the PR critical path once the test
          # lanes were rebalanced. Split the vitest suite across two runners
          # with Vitest's native --shard, the ~160s Rust tests into their own
          # lane, and the remaining static checks into a fourth. The four
          # lanes union to exactly check:all: check:static covers
          # check:eval-kernel, check:protocol-without-vitest, and
          # check:api-authority; check:runner covers the Rust half; and the
          # two vitest shards cover the package vitest file list.
          - lane_label: static checks
            command: check:static
          - lane_label: rust
            command: check:runner
          - lane_label: vitest 1/2
            command: test:typescript:vitest --shard=1/2
          - lane_label: vitest 2/2
            command: test:typescript:vitest --shard=2/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4

      # Share the checked-in lockfile key with master. PR merge refs must not
      # save full copies of the store or evict the post-merge build caches.
      - name: Locate pnpm store
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ steps.pnpm_store.outputs.arch }}-pnpm-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      # Same restore-only contract as the pnpm store above, for the Rust
      # dependency tree: master's post-merge verification is the sole writer
      # of release-runner-v1, and PR merge refs must not save branch-scoped
      # copies of a ~680MB target directory. Every key input below has to
      # match that writer in release-verify.yml exactly or each PR misses and
      # recompiles all 313 third-party crates in both profiles. A miss is a
      # slow run, never a wrong one.
      - name: Select the pinned Runner Rust toolchain
        working-directory: packages/paperclip-runner
        run: |
          set -uo pipefail

          # release-verify.yml runs on a single post-merge fleet image; the
          # gate here can route to ubuntu-latest or the public PR fleet, so
          # this tolerates an image without rustup instead of failing every
          # pull request. Without the pin the cache key simply will not match.
          if ! command -v rustup >/dev/null 2>&1; then
            echo '::notice title=Runner Rust cache::rustup is unavailable; building with the image default toolchain'
            exit 0
          fi

          rustup show
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

          # rust-cache hashes every installed toolchain into the cache key, not
          # only the active one. Each runner image also ships its own stable
          # Rust, and those disagree across images: 1.98.0 on the RunsOn fleets
          # against 1.98.1 on ubuntu-latest. Two runners that agreed on the pin
          # therefore still computed different keys, and every GitHub-hosted
          # pull request missed this cache while the fleet hit it. Remove every
          # toolchain except the pin, so the key depends on the pinned compiler
          # and the lockfile alone rather than on what the image happens to
          # carry. Keep this block identical in both workflows: the reader and
          # the writer must agree or the key matches nothing.
          extra_toolchains="$(rustup toolchain list | awk '{print $1}' | grep -vx "$toolchain" || true)"
          if [ -n "$extra_toolchains" ]; then
            echo "$extra_toolchains" | xargs -n1 rustup toolchain uninstall \
              || echo '::notice title=Runner Rust cache::could not remove an extra toolchain; the cache key may not match'
          fi
          rustup toolchain list

      - name: Restore Runner Rust dependencies (read only)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: release-runner-v1
          # Mirror the master writer: these also feed the cache key.
          cache-workspace-crates: false
          cache-bin: false
          # Restore only. Never let a pull request evict master's entry.
          save-if: false

      - name: Verify Paperclip Runner
        # pnpm appends trailing args to the end of the script's shell chain,
        # so the vitest lanes' --shard lands on `vitest run`. Do not add a
        # `--` separator: pnpm forwards it literally and vitest would then
        # read the shard flag as a test filter.
        run: pnpm --filter @paperclipai/paperclip-runner ${{ matrix.command }}

