name: AW V4 Verification

on:
  push:
    branches:
      - feat/august-works-unified-platform-v4
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: aw-v4-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  static-and-build:
    name: Typecheck, migration guards, build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile; then
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      - name: Verify Node policy
        run: pnpm check:node-version

      - name: Verify migration numbering and safety
        run: pnpm --filter @paperclipai/db check:migrations

      - name: Verify OpenClaw workflow smoke syntax
        run: bash -n scripts/smoke/openclaw-gateway-e2e.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  tests:
    name: Repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile; then
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      - name: Prepare workspace build dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Run stable test suite
        run: pnpm test:run

  security-evals:
    name: Security hard gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile; then
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      - name: Prepare workspace build dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Prepare generated-code sandbox
        shell: bash
        run: |
          if [ ! -x /usr/bin/bwrap ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          test -x /usr/bin/bwrap
          test -x /usr/bin/prlimit

      - name: Verify security-eval coverage
        run: pnpm check:aw-v4-security-evals

      - name: Run deterministic security hard gates
        run: pnpm test:aw-v4-security-evals

  pilot-readiness:
    name: Pilot readiness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - static-and-build
      - tests
      - security-evals
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile; then
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi

      - name: Verify customer-pilot readiness contract
        run: pnpm check:aw-v4-pilot-readiness

      - name: Test customer-pilot readiness gate
        run: pnpm test:aw-v4-pilot-readiness

