          managed_connection=false
          for spec in $specs; do
            case "$spec" in
              tests/e2e/connection-intents.spec.ts|tests/e2e/connection-review-approve.spec.ts|tests/e2e/connection-review-decline.spec.ts|tests/e2e/connection-review-always.spec.ts|tests/e2e/connection-review-failure.spec.ts|tests/e2e/mcp-user-stories.spec.ts|tests/e2e/signoff-policy.spec.ts|tests/e2e/pipelines-tutorial-flow.spec.ts)
                managed_connection=true ;;
            esac
          done
          echo "managed_connection=$managed_connection" >> "$GITHUB_OUTPUT"

      # Reuse the same source-bound build and exact checks as the server lane.
      - name: Install selected managed connection image Node
        if: steps.e2e_suites.outputs.managed_connection == 'true'
        env:
          ERASER_TEST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: *managed_native_image_node

      - name: Download selected managed connection provider pack
        if: steps.e2e_suites.outputs.managed_connection == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: managed-native-provider-pack-${{ github.run_id }}
          path: ${{ runner.temp }}/paperclip-native-provider-pack-artifact

      - name: Prepare selected managed connection image bytes
        if: steps.e2e_suites.outputs.managed_connection == 'true'
        run: *managed_native_image_bytes

      - name: Set up pinned optional numerical interpreter
        if: contains(steps.e2e_suites.outputs.specs, 'statistical-forecast.spec.ts') || contains(steps.e2e_suites.outputs.specs, 'causal-dowhy.spec.ts')
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'

      - name: Install selected native sandbox
        if: contains(steps.e2e_suites.outputs.specs, 'statistical-forecast.spec.ts') || contains(steps.e2e_suites.outputs.specs, 'causal-dowhy.spec.ts') || steps.e2e_suites.outputs.managed_connection == 'true'
        run: bash scripts/ci-install-native-sandbox.sh

      - name: Install selected hash-locked numerical runtimes
        if: contains(steps.e2e_suites.outputs.specs, 'statistical-forecast.spec.ts') || contains(steps.e2e_suites.outputs.specs, 'causal-dowhy.spec.ts')
        env:
          AW_E2E_SPECS: ${{ steps.e2e_suites.outputs.specs }}
        run: |
          set -euo pipefail
          # The production worker clears ambient loader variables as well.
          env -i PATH=/usr/bin:/bin "$pythonLocation/bin/python" -I \
            -c 'import platform; print(platform.python_version())'
          if [[ " $AW_E2E_SPECS " == *" tests/e2e/statistical-forecast.spec.ts "* ]]; then
            python -m venv "$RUNNER_TEMP/aw-statistical-runtime"
            "$RUNNER_TEMP/aw-statistical-runtime/bin/pip" install --only-binary=:all: --require-hashes \
              -r server/src/services/scripts/statsforecast-requirements.lock
            echo "PAPERCLIP_STATSFORECAST_PYTHON=$RUNNER_TEMP/aw-statistical-runtime/bin/python" >> "$GITHUB_ENV"
          fi
          if [[ " $AW_E2E_SPECS " == *" tests/e2e/causal-dowhy.spec.ts "* ]]; then
            python -m venv "$RUNNER_TEMP/aw-causal-runtime"
            "$RUNNER_TEMP/aw-causal-runtime/bin/pip" install --only-binary=:all: --require-hashes \
              -r server/src/services/scripts/dowhy-requirements.lock
            echo "PAPERCLIP_DOWHY_PYTHON=$RUNNER_TEMP/aw-causal-runtime/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Verify selected numerical workers in the native sandbox
        if: contains(steps.e2e_suites.outputs.specs, 'statistical-forecast.spec.ts') || contains(steps.e2e_suites.outputs.specs, 'causal-dowhy.spec.ts')
        env:
          AW_E2E_SPECS: ${{ steps.e2e_suites.outputs.specs }}
        run: |
          set -euo pipefail
          suites=()
          if [[ " $AW_E2E_SPECS " == *" tests/e2e/statistical-forecast.spec.ts "* ]]; then
            suites+=(server/src/__tests__/business-forecasting-statistical-worker.integration.test.ts)
          fi
          if [[ " $AW_E2E_SPECS " == *" tests/e2e/causal-dowhy.spec.ts "* ]]; then
            suites+=(server/src/__tests__/causal-dowhy-worker.integration.test.ts)
          fi
          pnpm exec vitest run "${suites[@]}" --maxWorkers=1

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
          AW_E2E_SPECS: ${{ steps.e2e_suites.outputs.specs }}
        run: |
          # Playwright's own --shard balances by test count, and one spec
          # (smoke-lab) is ~40% of the lane's wall clock. Partition by recorded
          # spec duration instead so both runners finish together.
          specs="$AW_E2E_SPECS"
          echo "shard ${{ matrix.shard_label }} specs: $specs"
          # specs is an intentional argument list.
          # shellcheck disable=SC2086
          pnpm run test:e2e $specs

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard_index }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

  e2e:
    # Preserve the legacy required-check name while the specs run sharded
    # across the matrix above (same pattern as the `verify` aggregate).
    name: e2e
    if: ${{ always() }}
    needs: [gate, policy, e2e_shards]
    runs-on: ${{ needs.gate.outputs.runner }}
    timeout-minutes: 5

    steps:
      - name: Fail if any e2e shard failed
        env:
          FULL_CI: ${{ needs.gate.outputs.full_ci }}
          POLICY_RESULT: ${{ needs.policy.result }}
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
        run: |
          test "$POLICY_RESULT" = "success"
          case "$FULL_CI" in
            true) test "$E2E_SHARDS_RESULT" = "success" ;;
            false) test "$E2E_SHARDS_RESULT" = "skipped" ;;
            *)
              echo "Invalid full_ci decision: $FULL_CI" >&2
              exit 1
              ;;
          esac
