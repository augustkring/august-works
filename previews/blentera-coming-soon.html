<title>BLENTERA — Coming soon</title>

<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#0e1b29;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:64px 24px;background:#fbfcf9}
main{display:flex;flex-direction:column;align-items:center;text-align:center;width:min(100%,720px);margin:auto}
.logo{display:block;width:clamp(210px,38vw,300px);height:auto;margin-bottom:clamp(56px,9vh,88px)}
.status{margin:0 0 24px;color:#067873;font-size:.79rem;line-height:1.4;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
h1{max-width:700px;margin:0;font-size:clamp(2.35rem,5.3vw,4.4rem);line-height:1.1;font-weight:600;letter-spacing:-.048em;text-wrap:balance}
.teaser{max-width:450px;margin:25px 0 0;color:#586472;font-size:clamp(1rem,1.7vw,1.15rem);line-height:1.6;text-wrap:pretty}
form{width:min(100%,530px);margin-top:44px;text-align:left}
.fields{display:flex;gap:10px;width:100%}
input{min-width:0;min-height:54px;flex:1 1 auto;border:1px solid #cdd5dd;border-radius:10px;padding:0 17px;background:#fff;color:#0e1b29;font:inherit;font-size:1rem}
input::placeholder{color:#737f8b}
input:hover{border-color:#8795a3}
input:focus-visible{outline:3px solid rgba(33,135,208,.22);outline-offset:2px;border-color:#0758b3}
input[aria-invalid=true]{border-color:#b24a4a}
button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:54px;padding:0 24px;border:1px solid #0e1b29;border-radius:10px;background:#0e1b29;color:#fff;cursor:pointer;font:inherit;font-size:.95rem;font-weight:650}
button:hover{background:#1c3b59;border-color:#1c3b59}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(33,135,208,.42);outline-offset:3px}
.feedback{margin:12px 0 0;color:#9a3333;font-size:.875rem;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(max-width:480px){body{padding:48px 20px}.logo{margin-bottom:58px}h1{font-size:clamp(2.1rem,9vw,2.7rem)}.teaser{margin-top:22px}form{margin-top:36px}.fields{flex-direction:column;gap:12px}input,button{width:100%;min-height:54px}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>

<p class="status">Coming soon</p>
<h1>AI is getting smarter. Is your company?</h1>
<p class="teaser">BLENTERA brings your AI tools, company knowledge and workflows together—so you don't have to start from scratch every time.</p>
<form id="waitlist" novalidate>
<div class="fields">
<label class="sr-only" for="email">Email address</label>
<input id="email" type="email" name="email" autocomplete="email" maxlength="254" placeholder="Your email address" required>
<button type="submit">Join waitlist</button>
</div>
<p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
</form>
</main>
<script>
const form=document.querySelector("#waitlist");
const feedback=document.querySelector("#feedback");
form.addEventListener("submit",function(event){
event.preventDefault();
const input=document.querySelector("#email");
const valid=input.validity.valid;
input.setAttribute("aria-invalid",String(!valid));
feedback.hidden=false;
feedback.textContent=valid?"Preview only — live email signup is not connected yet.":"Enter a valid email address.";
});
</script>
