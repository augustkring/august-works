name: V9 experience contract coverage
on:
  pull_request:
    paths:
      - 'doc/experience/v9/**'
      - 'evals/aw-v9/**'
      - 'packages/shared/src/**'
      - 'server/src/**'
      - 'ui/src/**'
      - 'doc/reference/aw-v9/brief/**'
      - 'scripts/check-aw-v9-coverage.mjs'
      - '.github/workflows/aw-v9-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-aw-v9-coverage.mjs
