  color-scheme: light;

  --white: #ffffff;

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 94px; }
body { margin: 0; background: var(--paper); color: var(--ink); min-width: 320px; }
button,input,textarea,select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img,svg { display: block; max-width: 100%; }
strong { font-weight: 620; }
:focus-visible { outline: 3px solid #4c8e71; outline-offset: 4px; }
::selection { background: #b7d4c3; color: #162722; }
.page-container { width: min(calc(100% - 112px),var(--content-width)); margin-inline: auto; }
.page { overflow: clip; }
.section-breath { padding-block: clamp(94px,10.5vw,156px); }
h1,h2,h3,p { margin-top: 0; }
h1,h2,h3 { font-family: 'Inter Display',Inter,sans-serif; }
h2 { font-size: clamp(38px,4.2vw,63px); font-weight: 520; line-height: 1.08; letter-spacing: -.063em; }
h3 { letter-spacing: -.037em; }
em { font-style: normal; color: var(--green); }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; left: 20px; top: 12px; z-index: 200; padding: 12px 20px; color: var(--white); background: var(--green); transform: translateY(-160%); }
.skip-link:focus { transform: translateY(0); }
/* Global navigation */
.site-header { position: sticky; top: 0; z-index: 100; background: rgba(247,248,246,.96); border-bottom: 1px solid var(--border); backdrop-filter: blur(18px); }
.header-inner { display: flex; align-items: center; min-height: 75px; gap: 34px; }
.brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; white-space: nowrap; font-size: 18px; font-weight: 740; letter-spacing: -.038em; line-height: 1; }
.brand-symbol { width: 28px; height: 30px; position: relative; display: grid; align-items: center; }
.brand-symbol b { display:block; height: 6px; background: var(--green); border-radius: 1px; transform: skew(-16deg); }
.brand-symbol b:nth-child(1) { width: 21px; margin-left: 3px; }
.brand-symbol b:nth-child(2) { width: 22px; margin-left: 0; }
.brand-symbol b:nth-child(3) { width: 18px; margin-left: 6px; }
.site-nav { display:flex; align-items:center; gap: 32px; margin-inline: auto; }
.site-nav a { font-size: 13px; text-decoration:none; font-weight: 540; color:#4c605b; transition:color .14s; }
.site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--green); }
.header-cta { font-size: 12px; font-weight: 600; text-decoration: none; padding: 12px 16px; border: 1px solid #657c6b; border-radius: 5px; display: flex; gap: 22px; align-items: center; white-space:nowrap; }
.header-cta:hover { border-color: var(--green); background: var(--mint-soft); }
.mobile-menu-button { display: none; border: 1px solid var(--border); color: var(--ink); background: transparent; padding: 10px; border-radius: 4px; margin-left:auto; align-items: center; gap:8px; }
.mobile-menu-button span { height:1.5px; width:18px; display:block; background: currentColor; margin-block: 5px; }
/* Universal links */
.button-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
.button { display: inline-flex; align-items: center; justify-content: space-between; gap: 30px; text-decoration:none; padding: 16px 19px; min-height:49px; border-radius:5px; border: 1px solid transparent; background:transparent; line-height:1.2; font-size:13px; font-weight:650; white-space:nowrap; transition: background .16s,border-color .16s,color .16s; }
.button--primary { background:var(--green); color:white; }
.button--primary:hover { background: #174c3a; }
.button--plain { color:var(--ink); border-color:var(--border); }

.button--outline-light { border: 1px solid rgba(220,236,228,.5); color:#f7faf7; }
.button--outline-light:hover { border-color:white; background:rgba(255,255,255,.08); }
.button--mini { border-color: #aac7b9; font-size:12px; color: #f4f8f6; padding:12px 14px; min-height: 39px; }
.button--mini:hover { background:rgba(255,255,255,.09); }
.text-link { font-weight: 620; text-decoration: none; font-size: 14px; display: inline-flex; gap: 26px; align-items: center; border-bottom:1px solid currentColor; padding-bottom: 7px; }
.text-link:hover { color:var(--green); }
.category-line { font-size: 12px; font-weight: 630; display:flex; align-items:center; gap: 11px; color:var(--ink-2); margin-bottom: 40px; letter-spacing: .015em; }
.category-line__mark { width: 7px; height: 7px; border-radius: 50%; background:var(--green); box-shadow:0 0 0 3px #dcece2; }
/* Hero */
.hero-shell { padding-block: clamp(88px,9vw,146px) 94px; background:#f7f8f6; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(420px, .91fr); align-items: center; gap: clamp(42px,4.7vw,76px); }
.hero-copy { position:relative; z-index:1; }
.hero-copy h1 { font-size: clamp(58px,5.9vw,88px); letter-spacing: -.071em; font-weight:540; line-height:1.015; margin-bottom:30px; }
.hero-copy h1 em { color: var(--green); }
.hero-lead { max-width: 510px; color:var(--ink-2); font-size:clamp(16px,1.42vw,19px); line-height:1.66; margin-bottom:32px; }
.hero-product { align-self: center; position:relative; }
.visual-footnote { font-size: 11px; text-align:right; color:#7b8882; margin:13px 3px 0; }
.workspace-panel { overflow: hidden; border:1px solid #ccdad2; background:white; border-radius:8px; box-shadow:0 30px 80px -48px rgba(21,52,43,.33); }
.workspace-panel__top { height:48px; padding-inline:19px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #e6ece8; background:#fefefe; }
.workspace-brand { display:flex; align-items:center; gap:7px; font-size: 11px; font-weight:720; }
.workspace-brand__icon { color:var(--green); font-size:21px; }
.workspace-brand__slash { font-weight:400; color:#a9b8ad; }
.workspace-demo-label { font-size:10px; color:#5c7566; border-radius:3px; padding:5px 8px; background:#eef3ef; }
.workspace-panel__body { display:grid; grid-template-columns:118px minmax(0,1fr); min-height:478px; }
.workspace-sidebar { display:flex; flex-direction:column; gap:4px; border-right:1px solid #e9eee9; padding: 20px 10px; background:#f9fbf9; }

.workspace-navitem { font-size:10.5px; padding:10px 8px; border-radius:4px; display:flex; gap:8px; color:#5d7368; align-items:center; }
.workspace-navitem.is-current { color:#2c5747; background:#e7f0e9; font-weight:650; }
.workspace-navitem__glyph { width:17px; font-size:13px; }
.workspace-sidebar__bottom { margin-top:auto; font-size:9px; color:#627668; display:flex; justify-content:space-between; }
.scope-check { color:#2d8059; }
.workspace-content { padding: 22px 22px 18px; min-width:0; }
.workspace-breadcrumb { color:#5f7468; font-size:10px; }
.workspace-breadcrumb span { margin-inline:5px; color:#bdcac1; }
.workspace-main-title { font-weight:670; font-size:16px; letter-spacing:-.035em; margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.workspace-status { flex-shrink:0; display:inline-block; padding: 5px 7px; font-size:9px; letter-spacing:0; font-weight:550; color:#9a702d; border:1px solid #e7d9bc; background:#fbf5e9; border-radius:3px; }
.workspace-desc { font-size:11px; line-height:1.6; color:#596f63; margin-top: 7px; margin-bottom:23px; }
.task-flow { border:1px solid #e5ece7; border-radius:6px; padding:17px; }
.task-flow__row { display:flex; align-items:center; gap:11px; }
.flow-avatar { flex-shrink:0; width:28px; height:28px; display:grid; place-items:center; font-size:11px; font-weight:760; border-radius:5px; border:1px solid #c8d8ce; background:#eef3ef; color:#276349; }
.flow-avatar--human { color:#31506e; background:#e7eff6; border-color:#c3d5e4; }
.flow-avatar--chief { color:#28604b; background:#d6eadb; border-color:#a4c9b1; }
.flow-avatar--small { width:21px; height:21px; font-size:9px; display:inline-grid; vertical-align:middle; margin-right:6px; }
.flow-text { display:grid; gap:2px; }

.flow-text small { font-size:9.5px; color:#5e7566; }
.flow-tick { margin-left:auto; color:#44865d; font-size:12px; }

.task-flow__gate-pill { margin-left:auto; color:#92682c; font-size:9px; }
.workspace-footer { display:flex; align-items:center; gap:8px; color:#64816c; font-size:9.5px; line-height:1.5; margin-top:17px; }

/* Thesis band */
.thesis-strip { background:var(--green-deep); color:#e7f4ed; }
.thesis-strip__inner { padding-block:52px; display:flex; align-items:end; justify-content:space-between; gap:45px; }

.thesis-strip__aside { font-size:12.5px; line-height:1.7; color:#b6cfc0; max-width:235px; }
/* Story and persistence */
.story-layout { display:grid; grid-template-columns: 1.07fr .65fr; gap:clamp(65px,13vw,195px); align-items:start; }
.story-intro h2 { max-width:720px; }
.story-body { padding-top:11px; }
.story-body p { color:#556962; font-size:17px; line-height:1.75; margin:0 0 21px; }

.persistence-visual { margin-top:83px; max-width:960px; }
.persistence-visual__edge { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; }

/* Capability */

.section-heading > p { width:min(360px,35%); flex-shrink:0; font-size:15px; line-height:1.8; color:#526a61; margin:0; }
.capability-list { border-top:1px solid #cbd8d1; }
.capability-item { display:grid; grid-template-columns:40px minmax(0,1fr) 305px; gap:30px; border-bottom:1px solid var(--border); align-items:center; min-height:164px; padding:29px 0; }
.capability-item__index { border:1px solid #c2d6c9; width:29px; height:29px; display:grid; place-items:center; font-size:13px; font-weight:690; color:#42795d; }

.artifact-pill { padding:8px 11px; color:#556f61; border:1px solid #cddbd2; font-size:10px; background:#f8faf8; border-radius:3px; white-space:nowrap; }
.artifact-pill--solid { color:#1f694a; background:#e4f1e7; border-color:#acd3b8; }

.mini-org__human,.mini-org__chief { width:min(380px,100%); display:grid; gap:7px; margin-inline:auto; border:1px solid #768d84; background:#203a31; padding:15px 23px; border-radius:4px; text-align:center; }

.mini-org__note { margin:22px 0 0!important; max-width:none!important; text-align:center; font-size:11px!important; color:#91a99b!important; }
/* Learning */

.policy-record__row { display:grid; grid-template-columns:92px 1fr 20px; gap:15px; align-items:center; border-bottom:1px solid #e9efeb; padding:22px 24px; }
.policy-record__row span { color:#647b6c; font-size:12px; }
.policy-record__row strong { font-size:13px; font-weight:590; }
.policy-record__row i { color:#287950; font-style:normal; }

.site-footer__upper p { color:#6a7e72; font-size:12px; line-height:1.6; margin:14px 0 0; }
.site-footer__links { display:grid; grid-template-columns:repeat(3,max-content); gap:21px 39px; }
.site-footer__links a { text-decoration:none; font-size:12px; color:#496156; }

.site-footer__bottom { border-top:1px solid var(--border); min-height:62px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#5f7567; }
/* Subpage heroes */

.subhero .category-line { margin-bottom:54px; }
.subhero__aside p { font-size:16px; line-height:1.8; color:var(--ink-2); margin-bottom:28px; }
.subhero__note { display:block; font-size:11px; line-height:1.7; color:#5e7367; border-top:1px solid #cbd9cf; padding-top:18px; }
/* About: organisation explainer */
.org-explorer { background:#fff; }
.org-heading { margin-bottom:50px; }

  <section class="thesis-strip" aria-label="Company thesis"><div class="page-container thesis-strip__inner"><p>Build your company's AI capability once.<br><strong>Keep building on it.</strong></p><span class="thesis-strip__aside">The foundation stays as people, models and tools change.</span></div></section>

  <section class="story-section section-breath" id="why">
    <div class="page-container story-layout">
      <div class="story-intro"><h2>Every new AI tool shouldn't mean <em>starting over.</em></h2></div>
      <div class="story-body"><p>Today, useful context, working methods and decisions often live inside individual conversations, tools and people's heads. A new person or agent has to rediscover them.</p><p>BLENTERA is the company layer underneath that work. You change the tools. You keep the capability.</p><a class="text-link" href="#!platform">See what the foundation holds <span aria-hidden="true">↗</span></a></div>
    </div>
    <div class="page-container persistence-visual" aria-label="What survives a change in tools">
      <div class="persistence-visual__edge"><span>New model</span><span>New colleague</span><span>New agent</span></div>
      <div class="persistence-visual__stem" aria-hidden="true"></div>
      <div class="persistence-visual__base"><div><span class="persistence-logo" aria-hidden="true">▤</span><strong>BLENTERA</strong><span class="persistence-visual__label">Company foundation</span></div><p>Context <b>·</b> Work <b>·</b> Governance <b>·</b> Learning</p></div>
      <div class="persistence-visual__after"><span aria-hidden="true">↳</span> The next initiative inherits the foundation. It doesn't rebuild it.</div>
    </div>
  </section>

  <section class="capability-section section-breath" id="platform">
    <div class="page-container"><div class="section-heading"><div><h2>One foundation.<br>Four things that work together.</h2></div><p>Not another disconnected agent dashboard. A place where the company's knowledge, work and operating rules meet.</p></div>
      <div class="capability-list">
        <div class="capability-item"><div class="capability-item__index">A</div><div class="capability-item__copy"><h3>Knowledge that belongs to the company.</h3><p>Shared context, connected knowledge and reviewed memory that can be corrected and reused.</p></div><div class="capability-item__artifact" aria-hidden="true"><span class="artifact-pill">Strategy / approved</span><span class="artifact-pill">Customer context</span><span class="artifact-pill artifact-pill--solid">Memory / reviewed ✓</span></div></div>
        <div class="capability-item"><div class="capability-item__index">B</div><div class="capability-item__copy"><h3>Work people and agents can share.</h3><p>Goals, tasks, roles, delegation and workflows organised around accountable outcomes.</p></div><div class="capability-item__artifact artifact-flow" aria-hidden="true"><span>Human lead</span><i></i><span>AI coordinator</span><i></i><span>Team</span></div></div>
        <div class="capability-item"><div class="capability-item__index">C</div><div class="capability-item__copy"><h3>Control that travels with the task.</h3><p>Identity, scoped permissions, approvals, limits and evidence—not policies buried in prompts.</p></div><div class="capability-item__artifact" aria-hidden="true"><span class="artifact-pill">Permission / scoped</span><span class="artifact-pill artifact-pill--amber">Approval / required</span></div></div>
        <div class="capability-item"><div class="capability-item__index">D</div><div class="capability-item__copy"><h3>Working knowledge that grows.</h3><p>Validated outcomes can become reviewed memory, reusable playbooks, skills and eventually software.</p></div><div class="capability-item__artifact" aria-hidden="true"><span class="artifact-pill artifact-pill--solid">Outcome reviewed ✓</span><span class="artifact-pill">Playbook v2.0</span></div></div>
      </div>
    </div>
  </section>

  <section class="orchestration-feature section-breath" id="agents">
    <div class="page-container orchestration-feature__head"><div><h2>One objective.<br>More than one agent.</h2><p>See how a human-led organisation can route work through AI functions and specialist teams—without giving up accountability.</p></div><a class="button button--outline-light" href="#!about">Explore the organisation <span aria-hidden="true">↗</span></a></div>
    <div class="page-container"><div class="mini-org" aria-label="Illustration of delegation through a Chief of Staff to specialist functions"><div class="mini-org__human"><span>Human leadership</span><strong>Sets direction &amp; approves</strong></div><div class="mini-org__line" aria-hidden="true"></div><div class="mini-org__chief"><span>AI Chief of Staff</span><strong>Routes work to the right teams</strong></div><div class="mini-org__branches" aria-hidden="true"></div><div class="mini-org__teams"><div><span>CTO function</span><strong>Engineering</strong><small>Build · QA · Reliability</small></div><div><span>CMO function</span><strong>Growth</strong><small>Research · Content · Campaigns</small></div><div><span>COO function</span><strong>Operations</strong><small>Process · Delivery · Support</small></div><div><span>CISO function</span><strong>Security</strong><small>Access · Risk · Review</small></div></div><p class="mini-org__note">Example role configuration. Human authority and permissions remain separate from AI planning.</p></div></div>
  </section>

  <section class="learning-section section-breath"><div class="page-container learning-grid"><div><h2>Work shouldn't just finish.<br>It should leave something useful behind.</h2><p>A result is valuable once. A reviewed way of working can help the next person, agent or task. BLENTERA is designed to make that progression possible.</p></div><div class="learning-steps" aria-label="How useful outcomes become reusable company capability"><div><span>1</span><strong>Do the work</strong><small>People + AI act from shared context</small></div><div><span>2</span><strong>Review the result</strong><small>Keep evidence, corrections and decisions</small></div><div><span>3</span><strong>Capture learning</strong><small>Promote validated lessons into memory</small></div><div><span>4</span><strong>Reuse the method</strong><small>Turn patterns into playbooks or workflows</small></div><div class="learning-steps__future"><span>→</span><strong>Software, when proven</strong><small>Stable steps can become deterministic</small></div></div></div></section>

  <section class="trust-preview"><div class="page-container trust-preview__inner"><div class="trust-preview__copy"><h2>Powerful agents. Clear responsibility.</h2><p>The model can plan and propose. People and policy decide what it may do. BLENTERA is designed for scope, approvals, evidence and replaceable runtimes.</p><a class="text-link" href="#!trust">Explore the control model <span aria-hidden="true">↗</span></a></div><div class="policy-record" aria-label="Example policy record"><div class="policy-record__head">Task permissions <span>Example policy</span></div><div class="policy-record__row"><span>May read</span><strong>Approved company context</strong><i aria-hidden="true">✓</i></div><div class="policy-record__row"><span>May draft</span><strong>Market entry brief</strong><i aria-hidden="true">✓</i></div><div class="policy-record__row"><span>May publish</span><strong>Human approval required</strong><i class="pending" aria-hidden="true">●</i></div><div class="policy-record__foot">Actions are limited by authority, not by how confident the agent sounds.</div></div></div></section>

<main id="main" class="page platform-page" tabindex="-1">
  <section class="subhero platform-hero"><div class="page-container subhero__grid"><div><h1>One foundation.<br><em>Whatever AI comes next.</em></h1></div><div class="subhero__aside"><p>BLENTERA is built to keep company knowledge, governed work, people and agents in one reusable layer while the underlying models, tools and runtimes evolve.</p><span class="subhero__note">Built platform foundation. Advanced capabilities are in development and subject to qualification.</span></div></div></section>
  <section class="platform-overview section-breath"><div class="page-container"><div class="section-heading"><div><h2>Designed for the entire<br>company AI capability.</h2></div><p>Each layer is useful by itself. Together, they give new people, agents and workflows a better place to start.</p></div><div class="platform-stack"><article class="stack-row"><div class="stack-row__id">Foundation</div><div><h3>Context that can be trusted</h3><p>Company facts, strategy, connected sources and reviewed memory. Context is owned by the organisation, not trapped in a chat session.</p></div><div class="stack-row__graphic"><span>Company facts</span><span>Connected knowledge</span><span>Governed memory</span></div></article><article class="stack-row"><div class="stack-row__id">Work</div><div><h3>Shared goals and execution</h3><p>Tasks, projects, agents, human roles and workflows operate against company objectives and documented ownership.</p></div><div class="stack-row__graphic"><span>Goals</span><span>Assignments</span><span>Workflows</span></div></article><article class="stack-row"><div class="stack-row__id">Capability</div><div><h3>Learning that becomes reusable</h3><p>Reviewed results can inform company memory, versioned playbooks, skills and improvements to how work gets done.</p></div><div class="stack-row__graphic"><span>Evidence</span><span>Playbooks</span><span>Evaluation</span></div></article><article class="stack-row"><div class="stack-row__id">Control</div><div><h3>Authority that stays explicit</h3><p>Identity, permissions, approval gates, budgets and evidence give automated work clear operating boundaries.</p></div><div class="stack-row__graphic"><span>Scope</span><span>Approvals</span><span>Audit</span></div></article></div></div></section>
  <section class="runtime-section section-breath"><div class="page-container runtime-section__grid"><div><h2>New models.<br>Same company memory.</h2><p>Bring your preferred agents, models and execution tools. BLENTERA's product direction keeps company context, standards and governance independent of any single provider.</p><a class="text-link" href="#!trust">Explore the controls <span aria-hidden="true">↗</span></a></div><div class="runtime-visual"><div class="runtime-visual__top"><span>People &amp; teams</span><span>Agents &amp; models</span><span>Apps &amp; tools</span></div><div class="runtime-visual__links" aria-hidden="true"><i></i><i></i><i></i></div><div class="runtime-visual__core"><span class="runtime-visual__core-symbol" aria-hidden="true">▤</span><strong>BLENTERA</strong><span>Company context · work · governance · capability</span></div><p>Replace the executor. Retain the company layer.</p></div></div></section>
  <section class="availability section-breath"><div class="page-container"><div class="availability__head"><div><h2>What exists today.<br>What's still being proven.</h2></div><p>Clarity matters. Code, enabled capability and an accepted hosted service are different milestones.</p></div><div class="availability-list"><div><div class="availability-list__dot availability-list__dot--implemented"></div><strong>Source-built foundation</strong><p>Underlying company/work/organisation primitives and platform architecture exist in the source.</p><span>Built in source</span></div><div><div class="availability-list__dot availability-list__dot--gated"></div><strong>Advanced intelligence</strong><p>Shared memory, learning, evaluations and extended orchestration require feature flags, verification and qualification.</p><span>Built / gated</span></div><div><div class="availability-list__dot availability-list__dot--pending"></div><strong>Hosted production</strong><p>Live hosted acceptance, customer pilots, operations and commercial validation remain separate release gates.</p><span>Not yet approved</span></div></div></div></section>
  <section class="closing-cta"><div class="page-container closing-cta__inner"><h2>Keep what you build.</h2><div><p>From the first valuable workflow to a company-wide operating foundation.</p><a class="button button--primary" href="#!about">See the organisation model <span aria-hidden="true">↗</span></a></div></div></section>
</main>

  <section class="subhero about-hero"><div class="page-container about-hero__grid"><div><h1>One company.<br><em>A different kind<br>of team.</em></h1></div><div class="subhero__aside about-hero__aside"><div class="about-map" aria-label="An illustrative human-led delegation structure"><div class="about-map__row about-map__row--human"><span>Human leadership</span><strong>Defines intent and authorises</strong></div><div class="about-map__transfer" aria-hidden="true">↓ &nbsp; delegates scope</div><div class="about-map__row about-map__row--chief"><span>AI Chief of Staff</span><strong>Plans, routes, tracks and escalates</strong></div><div class="about-map__transfer" aria-hidden="true">↓ &nbsp; specialist functions</div><div class="about-map__teams"><span>Technology</span><span>Product</span><span>Operations</span><span>Growth</span></div></div><p>People own the decisions. AI coordinates the work and specialist teams deliver within clear boundaries.</p><span class="subhero__note">Illustrative role model, not a claim of deployed employees or live agents.</span></div></div></section>

  <section class="film-section" aria-labelledby="film-heading"><div class="page-container film-section__layout"><div><h2 id="film-heading">A task isn't a prompt. <br>It's a chain of responsibility.</h2><p>From human intent to specialist execution, approvals and a result the company can reuse. This short visual explains the model before you explore it yourself.</p><details class="film-transcript"><summary>Read the sequence</summary><ol><li>A human defines an outcome and scope.</li><li>The AI Chief of Staff routes work to relevant functions.</li><li>Specialist teams share company context while completing their parts.</li><li>Policy requires human approval before high-impact action.</li><li>Reviewed outcomes become reusable company knowledge and standards.</li></ol></details></div><div class="film-section__visual"><video controls playsinline preload="none" poster="data:image/webp;base64,UklGRm5ZAABXRUJQVlA4IGJZAAAQ6wGdASoABdACPmEsk0gkIiGhIbGJWIAMCWlu8og1y/s17NnxFXuANQmv+u/ZL/JWs7rK9rZffTP0f/pf9i/Xj9x/Ul+Z/13+0fsT/ffTv8P+V/s39u/Zv+4e4Tln9K/kvNH+KfWX7v/af8b/vP8L+7fw1/hv71+13+W/cD2j+LH9N+ZvwBfjX8p/wn9u/xf+6/w3qc/2/bM6P/n/95/ofYC9aPmn+a/vf+l/6/+L9wP2b+9f2j96v7x8B/oX9V/3v+I/eH/VfYB/Iv6R/lP7z+8v+E//////BP8V4H33j/Pf8X/d/AD/Iv65/w/7n/qv2p+lL+B/6P+U/z37ge1D8r/xP/c/yP+p+Qn+Uf1n/l/3z/Vft1/////96v//9xX7jf//3Qf2x//wmZeNtRSqY21FKpjbUUqmNtRSqY21FKpjbUUqmNtRSqY21FKpjbUUqmNtRSqY21FKpjbUUqmNtRSqY21FKpjbUUqmNtRSqY21FKpjbUUqmNtRSqY21FKpjbUUqmNtRSqY21FKpjbUUqmNtRSqY21FKpjbUSTVGhHyK4QWqO9tQA4R6GKEfVVx5NVe6yHO8bailUxtqKVTG2opVMbailUxtqKVTG2nljSvV4UU151hViFQHUBqzJAg0KVTGOqOAk6SV/DgO0T0oB71gKkxHsnWdaNAAt7J1TB5tqKVTG2opVMbailUxtqKVTG2opVMbailO2DZIUHaBoFF1bAkM8lEwvcTmobSbPKVCWPYmuSuge8oDHqRcCeaiygDJuVpTOOtI13oaXrGl4aT05mOq/PcFLw0npzMdV+e4KXhpPTmY6r89wUvDSenMx1X57gpeGk9OZjqvx3iL8NJihLSnDxtqKV308HQQn9PB0EJ/TwdBCf08HQQn9PB0EJ/TwdBCf08HQQn9PB0EJ/TwdBCf08HQQextqKVTG2opVMbailUxtqKVTG2opVMbailUxtqKVTG2opVMbailUxtqKVTG2opVMbailUxtqKVTG2opVMbailUxtqKVTG2opVMbailUxtqKVTG2opVMbailUxtqKVTG2opVMbailUxtqKVTG2   <section class="roles-principle section-breath"><div class="page-container roles-principle__grid"><div><h2>Clear roles.<br>Flexible execution.</h2><p>Keep stable responsibilities in the organisation. Bring in temporary specialist capacity when a task needs it. Neither requires duplicating the company's knowledge or operating rules.</p></div><div class="role-modes"><div><span class="role-mode-symbol">01</span><h3>Persistent roles</h3><p>Chief of Staff, functional leads and long-lived teams maintain scope, ownership and continuity.</p></div><div><span class="role-mode-symbol">↗</span><h3>Task-scoped specialists</h3><p>Research, coding, review or analysis workers can join for a specific task and leave an auditable result.</p></div><div class="role-modes__rule">Human authority, model choice and permitted actions remain independent of the org chart.</div></div></div></section>
  <section class="company-about section-breath"><div class="page-container company-about__grid"><div><h2>Designed around a company, not a collection of bots.</h2></div><div><p>BLENTERA is building a shared AI foundation for organisations that want to increase capacity without losing knowledge or control. Founded by August Kring, the business is founder-led and its wider agent organisation is a product configuration model—not a claim about current staffing.</p><p>The direction is clear: people own priorities and consequential decisions; AI systems support specialist work; reviewed outcomes become reusable company capability.</p><a class="text-link" href="#!platform">Explore the platform model <span aria-hidden="true">↗</span></a></div></div></section>

  <section class="subhero trust-hero"><div class="page-container subhero__grid"><div><h1>Useful autonomy.<br><em>Without lost control.</em></h1></div><div class="subhero__aside"><p>AI can propose and execute work within defined boundaries. People and deterministic policy remain responsible for permissions, approvals and high-impact decisions.</p><span class="subhero__note">Design principles and source capabilities shown here are not a compliance certification or a production security attestation.</span></div></div></section>
  <section class="trust-content section-breath"><div class="page-container"><div class="section-heading"><div><h2>Authority is part of<br>the architecture.</h2></div><p>Orchestration alone isn't enough. A company needs to know what every agent may do and when a person must take over.</p></div><div class="trust-rules"><article><span>Define</span><h3>Purpose before permission</h3><p>Give work an owner, objective and scope. Access follows the task, not the agent's job title.</p></article><article><span>Constrain</span><h3>Limits before action</h3><p>Control tool access, sensitive data, costs and which actions can be taken without another check.</p></article><article><span>Approve</span><h3>Human judgment where it matters</h3><p>Require authorization before consequential changes—such as publication, spending or access expansion.</p></article><article><span>Verify</span><h3>Know what actually happened</h3><p>Keep observable status, outcomes and evidence so teams can review, correct and improve the system.</p></article></div></div></section>

  'use strict';
  const view = document.getElementById('app-view');

  const titles = {home:'BLENTERA — Company AI foundation',platform:'Platform | BLENTERA',about:'About the organisation | BLENTERA',trust:'Governance | BLENTERA'};
  let activePage = null;
  function parse() {
    const match = /^#!(home|platform|about|trust)(?:\/(.+))?$/.exec(location.hash);
    return match ? {page:match[1], section:match[2]||null} : {page:activePage||'home', section:location.hash.startsWith('#')?location.hash.slice(1):null};
  }
  function show() {
    const {page,section} = parse();
    if(page !== activePage) {
      view.replaceChildren(document.getElementById('tpl-'+page).content.cloneNode(true));
      document.title = titles[page];
      const sc = document.createElement('script');sc.textContent = source;view.appendChild(sc);sc.remove();
      activePage=page;
      if(!section) scrollTo(0,0);
    }
    if(section) requestAnimationFrame(() => {
      const target=document.getElementById(decodeURIComponent(section));
      if(target) target.scrollIntoView();
    });
  }
  document.addEventListener('click', event => {
    const a=event.target.closest && event.target.closest('a[href]');
    if(!a || event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link=a.getAttribute('href');
    if(!link || !link.startsWith('#!')) return;

    if(location.hash===link) show();
    else location.hash=link;
  });
  window.addEventListener('hashchange',show);
