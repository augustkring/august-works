          # because every spec shares one throwaway server and some toggle
          # instance-level flags, so it can only be parallelized across runners.
          # Each shard boots its own server, which keeps that isolation intact.
          # The catalog has grown to ~1694s of serial spec time (mean of runs
          # 35036001734 and 35024948947, 2026-09-15): with three shards and
          # stale durations the worst shard ran 745s of specs while the best
          # ran 277s. The former floors — chat-adapters-ui at ~442s and
          # agent-chat at ~310s — are each split into two specs, so eight
          # shards with refreshed durations level to ~212s each; the heaviest
          # remaining single spec is chat-adapters-ui-messaging at ~242s.
